name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Generate Gradle Wrapper JAR
        run: |
          # Use the pre-installed Gradle to generate proper wrapper files
          gradle wrapper --gradle-version=8.7 --distribution-type=bin
          ls -lh gradle/wrapper/
          echo "Gradle wrapper JAR generated successfully"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MyExpenseTracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Build Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            app/build/reports/
            app/build/outputs/
            ~/.gradle/daemon/*/daemon-*.log

      - name: Create GitHub Release with APK
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "My Expense Tracker v1.0.${{ github.run_number }}"
          body: |
            ## 📱 My Expense Tracker — Android APK

            Download the `app-debug.apk` file below and install it directly on your Android phone.

            ### 📥 How to Install
            1. Download `app-debug.apk` from the **Assets** section below
            2. On your Android phone → **Settings** → **Security** → enable **Install from Unknown Sources**
            3. Open the downloaded APK and tap **Install**

            ### ✨ Features
            - 💰 Track daily income & expenses in ₹ Indian Rupee
            - 📊 Dashboard with balance, monthly totals & budget progress
            - 🗂️ Customizable categories, budgets & reports
            - 🎯 Savings goals tracker
            - 🔁 Recurring transactions (rent, EMI, etc.)
            - 🔒 PIN lock security
            - 📤 Export to CSV · Backup & Restore

            ### 📋 Requirements
            - Android **8.0+** (API 26+)
            - No internet required — **100% Offline**

            ---
            *Built with Jetpack Compose · Material 3 · Room DB · MVVM*
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
