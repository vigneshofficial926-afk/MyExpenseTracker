name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper (includes wrapper JAR)
        run: |
          gradle wrapper --gradle-version=8.7 --distribution-type=bin
          chmod +x gradlew
          echo "=== Wrapper files ==="
          ls -lh gradle/wrapper/
          echo "=== gradlew first 5 lines ==="
          head -5 gradlew

      - name: Verify Build Files
        run: |
          echo "=== Root build.gradle.kts ==="
          cat build.gradle.kts
          echo ""
          echo "=== app/build.gradle.kts ==="
          cat app/build.gradle.kts
          echo ""
          echo "=== settings.gradle.kts ==="
          cat settings.gradle.kts

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build_output.txt
          echo "Exit code: ${PIPESTATUS[0]}"
        continue-on-error: true

      - name: Check if APK was built
        id: check_apk
        run: |
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "APK_EXISTS=true" >> $GITHUB_OUTPUT
            echo "APK built successfully!"
            ls -lh app/build/outputs/apk/debug/
          else
            echo "APK_EXISTS=false" >> $GITHUB_OUTPUT
            echo "APK NOT found - build failed"
            echo "=== BUILD OUTPUT (last 100 lines) ==="
            tail -100 build_output.txt || true
            echo "=== ERROR LINES ==="
            grep -E "(^e: |error:|FAILED)" build_output.txt | head -50 || true
          fi

      - name: Upload Debug APK Artifact
        if: steps.check_apk.outputs.APK_EXISTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MyExpenseTracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Build Output Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-log
          path: |
            build_output.txt
            app/build/reports/
          retention-days: 7

      - name: Fail if APK not built
        if: steps.check_apk.outputs.APK_EXISTS != 'true'
        run: exit 1

      - name: Create GitHub Release with APK
        if: steps.check_apk.outputs.APK_EXISTS == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "My Expense Tracker v1.0.${{ github.run_number }}"
          body: |
            ## 📱 My Expense Tracker — Android APK

            Download the `app-debug.apk` file below and install it directly on your Android phone.

            ### 📥 How to Install
            1. Download `app-debug.apk` from the **Assets** section below
            2. On your Android phone → **Settings** → **Security** → enable **Install from Unknown Sources**
            3. Open the downloaded APK and tap **Install**

            ### ✨ Features
            - 💰 Track daily income & expenses in ₹ Indian Rupee
            - 📊 Dashboard with balance, monthly totals & budget progress
            - 🗂️ Customizable categories, budgets & reports
            - 🎯 Savings goals tracker
            - 🔁 Recurring transactions (rent, EMI, etc.)
            - 🔒 PIN lock security
            - 📤 Export to CSV · Backup & Restore

            ### 📋 Requirements
            - Android **8.0+** (API 26+)
            - No internet required — **100% Offline**

            ---
            *Built with Jetpack Compose · Material 3 · Room DB · MVVM*
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
